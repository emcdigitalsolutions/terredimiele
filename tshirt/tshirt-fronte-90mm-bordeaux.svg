<?xml version="1.0" encoding="UTF-8"?>
<!--
  Terre di Miele — Stampa MAGLIETTA FRONTE (petto sinistro) — su TESSUTO GIALLO
  VERSIONE BORDEAUX: bordeaux come accento decorativo.
  Larghezza fisica: 90 mm  ·  Altezza fisica: 78 mm

  Strategia di stampa: 3 COLORI.
    1) #3d2b0a (marrone scuro)   — testi, contorni esagono, ape principale
    2) #7A1B2C (bordeaux/vinaccia) — strisce ape, divider, esagonino centrale
    3) #FFFAF0 (bianco crema)    — ali ape e highlight occhi

  Il giallo del tessuto fa da "riempimento naturale" del corpo dell'ape e
  dell'interno dell'esagono. Niente sfondo da stampare → minor consumo di
  inchiostro, contrasto massimo, costo serigrafia ridotto.

  Per vector puro: aprire in Inkscape → Path → Object to Path su tutti i <text>.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="90mm" height="80mm"
     viewBox="0 0 900 800"
     font-family="'Playfair Display', Georgia, serif">

  <defs>
    <!-- Pattern honeycomb decorativo dentro l'esagono (linee fini marroni) -->
    <pattern id="hexInner" x="0" y="0" width="42" height="48" patternUnits="userSpaceOnUse">
      <polygon points="21,3 39,13 39,35 21,45 3,35 3,13"
               fill="none" stroke="#3d2b0a" stroke-width="1.4" opacity="0.28"/>
    </pattern>

    <!-- Gradient marrone/bordeaux per la scritta "di Miele" — coerente col
         biglietto v6 ma adattato alla palette mono+bordeaux (no oro perché
         su tessuto giallo perderebbe contrasto). -->
    <linearGradient id="honeyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3d2b0a"/>
      <stop offset="35%"  stop-color="#6B1218"/>
      <stop offset="55%"  stop-color="#9E2A2B"/>
      <stop offset="80%"  stop-color="#6B1218"/>
      <stop offset="100%" stop-color="#3d2b0a"/>
    </linearGradient>

    <!-- Symbol: ape stilizzata heraldic (corpo "trasparente": il giallo della
         maglietta lo riempie naturalmente attraverso fill=none) -->
    <symbol id="bee" viewBox="-100 -120 200 240" overflow="visible">
      <!-- ALI bianco crema (dietro al corpo) -->
      <g stroke="#3d2b0a" stroke-width="3" stroke-linejoin="round">
        <path d="M -8 -52 Q -56 -78 -86 -64 Q -98 -52 -90 -34 Q -72 -22 -42 -28 Q -22 -36 -8 -46 Z"
              fill="#FFFAF0"/>
        <path d="M 8 -52 Q 56 -78 86 -64 Q 98 -52 90 -34 Q 72 -22 42 -28 Q 22 -36 8 -46 Z"
              fill="#FFFAF0"/>
        <path d="M -10 -32 Q -46 -20 -62 -8 Q -66 8 -54 18 Q -34 18 -18 4 Q -10 -6 -10 -24 Z"
              fill="#FFFAF0"/>
        <path d="M 10 -32 Q 46 -20 62 -8 Q 66 8 54 18 Q 34 18 18 4 Q 10 -6 10 -24 Z"
              fill="#FFFAF0"/>
      </g>
      <!-- Vene ali (dettaglio sottile, marrone scuro) -->
      <g stroke="#3d2b0a" stroke-width="1.2" fill="none" opacity="0.65">
        <path d="M -22 -44 Q -50 -54 -76 -54"/>
        <path d="M 22 -44 Q 50 -54 76 -54"/>
        <path d="M -18 -28 Q -42 -22 -56 -10"/>
        <path d="M 18 -28 Q 42 -22 56 -10"/>
      </g>

      <!-- CORPO: solo contorno spesso marrone, il giallo della maglietta riempie -->
      <ellipse cx="0" cy="14" rx="40" ry="58" fill="none" stroke="#3d2b0a" stroke-width="5"/>

      <!-- STRISCE: bande BORDEAUX che attraversano il corpo (accento) -->
      <path d="M -38 -8 Q 0 -18 38 -8 L 38 6 Q 0 -4 -38 6 Z" fill="#7A1B2C"/>
      <path d="M -40 18 Q 0 8 40 18 L 38 32 Q 0 22 -38 32 Z" fill="#7A1B2C"/>
      <path d="M -34 44 Q 0 36 34 44 L 28 58 Q 0 50 -28 58 Z" fill="#7A1B2C"/>

      <!-- TESTA: cerchio marrone pieno -->
      <circle cx="0" cy="-50" r="22" fill="#3d2b0a"/>

      <!-- OCCHI: bianco crema con punto marrone -->
      <ellipse cx="-9" cy="-52" rx="5.5" ry="6" fill="#FFFAF0"/>
      <ellipse cx="9"  cy="-52" rx="5.5" ry="6" fill="#FFFAF0"/>
      <circle cx="-8" cy="-52" r="2.5" fill="#3d2b0a"/>
      <circle cx="10" cy="-52" r="2.5" fill="#3d2b0a"/>

      <!-- ANTENNE -->
      <path d="M -8 -68 Q -18 -86 -28 -94" fill="none" stroke="#3d2b0a" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="-28" cy="-94" r="3.5" fill="#3d2b0a"/>
      <path d="M 8 -68 Q 18 -86 28 -94" fill="none" stroke="#3d2b0a" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="28" cy="-94" r="3.5" fill="#3d2b0a"/>

      <!-- PUNGIGLIONE -->
      <path d="M -5 70 L 0 84 L 5 70 Z" fill="#3d2b0a"/>

      <!-- ZAMPE (sottili, decorative) -->
      <g stroke="#3d2b0a" stroke-width="2" fill="none" stroke-linecap="round">
        <path d="M -30 4  Q -46 4  -54 14"/>
        <path d="M  30 4  Q  46 4   54 14"/>
        <path d="M -38 28 Q -56 32 -62 44"/>
        <path d="M  38 28 Q  56 32  62 44"/>
      </g>
    </symbol>
  </defs>

  <!-- ── Emblem: esagono + ape ──────────────────────────────────────── -->
  <g transform="translate(450 230)">
    <!-- Esagono outer: outline spesso marrone (giallo della maglietta dentro) -->
    <polygon points="0,-185 160,-92 160,92 0,185 -160,92 -160,-92"
             fill="none" stroke="#3d2b0a" stroke-width="9" stroke-linejoin="round"/>
    <!-- Esagono inner ring: outline più sottile (effetto cornice) -->
    <polygon points="0,-160 138,-80 138,80 0,160 -138,80 -138,-80"
             fill="none" stroke="#3d2b0a" stroke-width="3"/>
    <!-- Pattern honeycomb fine all'interno -->
    <polygon points="0,-160 138,-80 138,80 0,160 -138,80 -138,-80"
             fill="url(#hexInner)"/>

    <!-- Ape al centro -->
    <use href="#bee" x="-95" y="-110" width="190" height="220"/>
  </g>

  <!-- ── Wordmark "Terre di Miele" — INGRANDITO al massimo (font 125) ─ -->
  <!-- paint-order=stroke fill aggiunge un mezzo-stroke che ispessisce ulteriormente
       i glifi per garantire impatto a 9 cm di larghezza reale anche a distanza.
       y=540 (era 510) per dare margine all'esagono emblem sopra. -->
  <g transform="translate(450 540)">
    <text text-anchor="middle" font-size="125" font-weight="700"
          letter-spacing="1">
      <tspan fill="#3d2b0a" stroke="#3d2b0a" stroke-width="1" paint-order="stroke fill">Terre </tspan><tspan font-style="italic" fill="url(#honeyGrad)" stroke="#3d2b0a" stroke-width="0.8" paint-order="stroke fill">di Miele</tspan>
    </text>
  </g>

  <!-- ── Divider con esagono — BORDEAUX (accento) ──────────────────── -->
  <g transform="translate(450 590)">
    <line x1="-280" y1="0" x2="-36" y2="0" stroke="#7A1B2C" stroke-width="2.5"/>
    <polygon points="0,-15 18,-5 18,11 0,21 -18,11 -18,-5" fill="#7A1B2C"/>
    <line x1="36" y1="0" x2="280" y2="0" stroke="#7A1B2C" stroke-width="2.5"/>
  </g>

  <!-- ── Apicoltura La Greca — INGRANDITO + EXTRA BOLD ────────────── -->
  <g transform="translate(450 660)">
    <text text-anchor="middle" font-family="'DM Sans', Helvetica, sans-serif"
          font-size="42" font-weight="800" fill="#3d2b0a" letter-spacing="11"
          stroke="#3d2b0a" stroke-width="0.6" paint-order="stroke fill">
      APICOLTURA LA GRECA
    </text>
  </g>

  <!-- ── Sub-tag: Miele Siciliano — INGRANDITO + BOLD pieno ─────────── -->
  <g transform="translate(450 728)">
    <text text-anchor="middle" font-family="'DM Sans', Helvetica, sans-serif"
          font-size="32" font-weight="700" fill="#3d2b0a" letter-spacing="9"
          stroke="#3d2b0a" stroke-width="0.5" paint-order="stroke fill">
      MIELE SICILIANO
    </text>
  </g>

</svg>
