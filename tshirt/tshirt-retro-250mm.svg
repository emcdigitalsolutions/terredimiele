<?xml version="1.0" encoding="UTF-8"?>
<!--
  Terre di Miele — Stampa MAGLIETTA RETRO
  Larghezza fisica: 250 mm
  Altezza fisica:   ~90 mm
  Stampa: serigrafia o DTF/DTG. Composizione orizzontale tipo "banner schiena".
  Per stampa pure-vector: aprire in Inkscape → Path → Object to Path su tutti i <text>
  oppure in Illustrator → Type → Create Outlines, prima di esportare al fornitore.
  Font usati: "Playfair Display" (serif), "DM Sans" (sans), "Great Vibes" (script).
  Tutti Google Fonts free.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="250mm" height="90mm"
     viewBox="0 0 2500 900"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     font-family="'Playfair Display', Georgia, serif">

  <defs>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#F4C542"/>
      <stop offset="50%"  stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="darkGold2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#8B4513"/>
      <stop offset="35%"  stop-color="#B8860B"/>
      <stop offset="55%"  stop-color="#D4A017"/>
      <stop offset="80%"  stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#8B4513"/>
    </linearGradient>

    <!-- Cluster esagoni (ape decorativa sx + dx) -->
    <pattern id="hexBgRetro" x="0" y="0" width="80" height="92" patternUnits="userSpaceOnUse">
      <polygon points="40,4 76,24 76,68 40,88 4,68 4,24"
               fill="none" stroke="#3d2b0a" stroke-width="1.4" opacity="0.13"/>
    </pattern>
  </defs>

  <!-- ── Ornamento sinistro: cluster esagoni + ape ─────────────────── -->
  <g transform="translate(180 450)">
    <!-- Esagono grande sfondo -->
    <polygon points="0,-180 156,-90 156,90 0,180 -156,90 -156,-90"
             fill="url(#hexBgRetro)" opacity="0.6"/>
    <!-- Esagono medio in primo piano -->
    <polygon points="0,-110 95,-55 95,55 0,110 -95,55 -95,-55"
             fill="url(#goldGrad2)" stroke="#3d2b0a" stroke-width="5"/>
    <!-- Esagono piccolo dentro -->
    <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45"
             fill="#FFF3CC" opacity="0.45"/>

    <!-- Ape al centro (più piccola e pulita per la dimensione) -->
    <g transform="rotate(-10)">
      <ellipse cx="-22" cy="-20" rx="24" ry="14" fill="#fff" opacity="0.92" stroke="#3d2b0a" stroke-width="1.8"/>
      <ellipse cx="22"  cy="-20" rx="24" ry="14" fill="#fff" opacity="0.92" stroke="#3d2b0a" stroke-width="1.8"/>
      <ellipse cx="0"   cy="0"   rx="40" ry="28" fill="#F4C542" stroke="#3d2b0a" stroke-width="3"/>
      <rect x="-36" y="-10" width="72" height="9"  fill="#2c1810" rx="1"/>
      <rect x="-36" y="8"   width="72" height="9"  fill="#2c1810" rx="1"/>
      <circle cx="38" cy="-2" r="11" fill="#2c1810"/>
      <circle cx="41" cy="-4" r="2.6" fill="#fff"/>
      <path d="M 36 -12 Q 42 -22 50 -22" stroke="#2c1810" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <circle cx="50" cy="-22" r="2" fill="#2c1810"/>
      <path d="M 41 -12 Q 50 -18 58 -18" stroke="#2c1810" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <circle cx="58" cy="-18" r="2" fill="#2c1810"/>
    </g>
  </g>

  <!-- ── Ornamento destro: cluster esagoni in stile "drip" ─────────── -->
  <g transform="translate(2320 450)">
    <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75"
             fill="url(#hexBgRetro)" opacity="0.55"/>
    <polygon points="-30,-50 30,-15 30,55 -30,90 -90,55 -90,-15"
             fill="url(#goldGrad2)" opacity="0.85" stroke="#3d2b0a" stroke-width="3"/>
    <polygon points="40,40 80,63 80,109 40,132 0,109 0,63"
             fill="#D4A017" opacity="0.7" stroke="#3d2b0a" stroke-width="2.5"/>
    <polygon points="-20,75 12,93 12,129 -20,147 -52,129 -52,93"
             fill="#F4C542" opacity="0.6" stroke="#3d2b0a" stroke-width="2"/>
  </g>

  <!-- ── WORDMARK CENTRALE — "Terre di Miele" ─────────────────────── -->
  <g transform="translate(1250 360)">
    <!-- Tag superiore "APICOLTORE SICILIANO" -->
    <g transform="translate(0 -50)">
      <line x1="-220" y1="0" x2="-110" y2="0" stroke="#B8860B" stroke-width="2"/>
      <line x1="110"  y1="0" x2="220"  y2="0" stroke="#B8860B" stroke-width="2"/>
      <text text-anchor="middle" y="6" font-family="'DM Sans', Helvetica, sans-serif"
            font-size="26" font-weight="700" fill="#8B4513" letter-spacing="9">
        APICOLTORE
      </text>
    </g>

    <!-- Brand name big -->
    <text text-anchor="middle" font-size="180" font-weight="700"
          fill="#3d2b0a" letter-spacing="2" y="100">
      <tspan>Terre </tspan><tspan font-style="italic" fill="url(#darkGold2)">di Miele</tspan>
    </text>

    <!-- Divider con esagono -->
    <g transform="translate(0 145)">
      <line x1="-280" y1="0" x2="-32" y2="0" stroke="#B8860B" stroke-width="1.5"/>
      <polygon points="-12,-12 12,-4 12,12 -12,20 -36,12 -36,-4"
               fill="#D4A017" transform="translate(12 -4)"/>
      <line x1="32" y1="0" x2="280" y2="0" stroke="#B8860B" stroke-width="1.5"/>
    </g>

    <!-- Tagline corsivo -->
    <text text-anchor="middle" font-family="'Great Vibes', cursive"
          font-size="90" fill="#B8860B" y="240" font-style="italic">
      Miele Siciliano
    </text>
  </g>

  <!-- ── Footer: nome + sito ──────────────────────────────────────── -->
  <g transform="translate(1250 770)">
    <text text-anchor="middle" font-family="'DM Sans', Helvetica, sans-serif"
          font-size="32" font-weight="600" fill="#3d2b0a" letter-spacing="3">
      SALVATORE LA GRECA
    </text>
    <text text-anchor="middle" y="42" font-family="'DM Sans', Helvetica, sans-serif"
          font-size="22" font-weight="400" fill="#6B4F0A" letter-spacing="5" opacity="0.85">
      CAMPOBELLO DI LICATA  ·  www.terredimiele.it
    </text>
  </g>

</svg>
