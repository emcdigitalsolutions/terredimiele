<?xml version="1.0" encoding="UTF-8"?>
<!--
  Terre di Miele — Stampa MAGLIETTA RETRO (centro schiena) — su TESSUTO GIALLO
  VERSIONE BORDEAUX: bordeaux come accento decorativo.
  Larghezza fisica: 250 mm  ·  Altezza fisica: 110 mm

  Strategia di stampa: 3 COLORI.
    1) #3d2b0a (marrone scuro)   — testi, contorni, ape principale
    2) #7A1B2C (bordeaux/vinaccia) — strisce ape, divider, esagonini, goccia miele
    3) #FFFAF0 (bianco crema)    — ali ape e highlight

  Composizione: layout 3-fasce orizzontali con asse verticale centrale.
  - Top:    APICOLTURA LA GRECA (tag principale)
  - Middle: Wordmark "Terre di Miele" gigante con esagono+ape integrati ai lati
  - Bottom: tagline "Miele Siciliano" + località/sito
  - Pattern honeycomb molto leggero in tutto lo sfondo (decorativo)

  Per vector puro: aprire in Inkscape → Path → Object to Path su tutti i <text>.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="250mm" height="125mm"
     viewBox="0 0 2500 1250"
     font-family="'Playfair Display', Georgia, serif">

  <defs>
    <!-- Pattern honeycomb sfondo (sottile, marrone scuro su giallo tessuto) -->
    <pattern id="hexBgR" x="0" y="0" width="78" height="90" patternUnits="userSpaceOnUse">
      <polygon points="39,3 75,23 75,67 39,87 3,67 3,23"
               fill="none" stroke="#3d2b0a" stroke-width="1.2" opacity="0.10"/>
    </pattern>
    <!-- Pattern honeycomb più denso dentro l'esagono dell'ape -->
    <pattern id="hexEmblem" x="0" y="0" width="44" height="50" patternUnits="userSpaceOnUse">
      <polygon points="22,3 41,13 41,37 22,47 3,37 3,13"
               fill="none" stroke="#3d2b0a" stroke-width="1.4" opacity="0.32"/>
    </pattern>

    <!-- Gradient marrone/bordeaux per la scritta "di Miele" -->
    <linearGradient id="honeyGradR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3d2b0a"/>
      <stop offset="35%"  stop-color="#6B1218"/>
      <stop offset="55%"  stop-color="#9E2A2B"/>
      <stop offset="80%"  stop-color="#6B1218"/>
      <stop offset="100%" stop-color="#3d2b0a"/>
    </linearGradient>

    <!-- Symbol: ape (riuso definizione, scalata) -->
    <symbol id="beeR" viewBox="-100 -120 200 240" overflow="visible">
      <g stroke="#3d2b0a" stroke-width="3" stroke-linejoin="round">
        <path d="M -8 -52 Q -56 -78 -86 -64 Q -98 -52 -90 -34 Q -72 -22 -42 -28 Q -22 -36 -8 -46 Z" fill="#FFFAF0"/>
        <path d="M 8 -52 Q 56 -78 86 -64 Q 98 -52 90 -34 Q 72 -22 42 -28 Q 22 -36 8 -46 Z" fill="#FFFAF0"/>
        <path d="M -10 -32 Q -46 -20 -62 -8 Q -66 8 -54 18 Q -34 18 -18 4 Q -10 -6 -10 -24 Z" fill="#FFFAF0"/>
        <path d="M 10 -32 Q 46 -20 62 -8 Q 66 8 54 18 Q 34 18 18 4 Q 10 -6 10 -24 Z" fill="#FFFAF0"/>
      </g>
      <g stroke="#3d2b0a" stroke-width="1.2" fill="none" opacity="0.65">
        <path d="M -22 -44 Q -50 -54 -76 -54"/>
        <path d="M 22 -44 Q 50 -54 76 -54"/>
        <path d="M -18 -28 Q -42 -22 -56 -10"/>
        <path d="M 18 -28 Q 42 -22 56 -10"/>
      </g>
      <ellipse cx="0" cy="14" rx="40" ry="58" fill="none" stroke="#3d2b0a" stroke-width="5"/>
      <path d="M -38 -8 Q 0 -18 38 -8 L 38 6 Q 0 -4 -38 6 Z" fill="#7A1B2C"/>
      <path d="M -40 18 Q 0 8 40 18 L 38 32 Q 0 22 -38 32 Z" fill="#7A1B2C"/>
      <path d="M -34 44 Q 0 36 34 44 L 28 58 Q 0 50 -28 58 Z" fill="#7A1B2C"/>
      <circle cx="0" cy="-50" r="22" fill="#3d2b0a"/>
      <ellipse cx="-9" cy="-52" rx="5.5" ry="6" fill="#FFFAF0"/>
      <ellipse cx="9"  cy="-52" rx="5.5" ry="6" fill="#FFFAF0"/>
      <circle cx="-8" cy="-52" r="2.5" fill="#3d2b0a"/>
      <circle cx="10" cy="-52" r="2.5" fill="#3d2b0a"/>
      <path d="M -8 -68 Q -18 -86 -28 -94" fill="none" stroke="#3d2b0a" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="-28" cy="-94" r="3.5" fill="#3d2b0a"/>
      <path d="M 8 -68 Q 18 -86 28 -94" fill="none" stroke="#3d2b0a" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="28" cy="-94" r="3.5" fill="#3d2b0a"/>
      <path d="M -5 70 L 0 84 L 5 70 Z" fill="#3d2b0a"/>
      <g stroke="#3d2b0a" stroke-width="2" fill="none" stroke-linecap="round">
        <path d="M -30 4  Q -46 4  -54 14"/>
        <path d="M  30 4  Q  46 4   54 14"/>
        <path d="M -38 28 Q -56 32 -62 44"/>
        <path d="M  38 28 Q  56 32  62 44"/>
      </g>
    </symbol>
  </defs>

  <!-- ── Niente sfondo: il pattern honeycomb resta solo dentro gli esagoni
       dei cluster sx/dx (via url(#hexEmblem)). Sfondo = tessuto giallo nudo. -->
  <!-- (rimosso <rect> con url(#hexBgR) per non saturare visivamente) -->

  <!-- ── Ornamento sinistro: cluster esagoni (centrato con wordmark, più esterno) ── -->
  <g transform="translate(220 420)">
    <!-- Esagono grande outline -->
    <polygon points="0,-200 174,-100 174,100 0,200 -174,100 -174,-100"
             fill="url(#hexEmblem)" stroke="#3d2b0a" stroke-width="6"/>
    <!-- Esagono medio dentro (cornice) -->
    <polygon points="0,-170 148,-85 148,85 0,170 -148,85 -148,-85"
             fill="none" stroke="#3d2b0a" stroke-width="2"/>
    <!-- Ape grande al centro dell'esagono sx -->
    <use href="#beeR" x="-110" y="-130" width="220" height="260"/>
  </g>

  <!-- ── Ornamento destro: cluster esagoni (centrato con wordmark, più esterno) ──── -->
  <g transform="translate(2280 420)">
    <!-- Esagono grande outline -->
    <polygon points="0,-180 156,-90 156,90 0,180 -156,90 -156,-90"
             fill="url(#hexEmblem)" stroke="#3d2b0a" stroke-width="5"/>
    <!-- Esagono interno con drop di miele stilizzato -->
    <polygon points="0,-130 112,-65 112,65 0,130 -112,65 -112,-65"
             fill="none" stroke="#3d2b0a" stroke-width="2"/>
    <!-- Goccia di miele (silhouette BORDEAUX al centro) -->
    <path d="M 0 -70
             Q 38 -10 38 30
             Q 38 70 0 70
             Q -38 70 -38 30
             Q -38 -10 0 -70 Z"
          fill="#7A1B2C"/>
    <!-- Highlight goccia (bianco crema) -->
    <ellipse cx="-10" cy="0" rx="8" ry="22" fill="#FFFAF0" opacity="0.85"/>
  </g>

  <!-- ── Tag superiore: APICOLTURA LA GRECA — INGRANDITO + EXTRA BOLD ── -->
  <!-- Testo font-size 56 + letter-spacing 14: half-width ~580u → linee da ±660 -->
  <g transform="translate(1250 240)">
    <!-- Esagonini centro y = 5 (range -13..23) → linee abbassate a y=5 -->
    <line x1="-820" y1="5" x2="-660" y2="5" stroke="#7A1B2C" stroke-width="3.5"/>
    <line x1="660"  y1="5" x2="820"  y2="5" stroke="#7A1B2C" stroke-width="3.5"/>
    <polygon points="-636,-13 -614,-2 -614,12 -636,23 -658,12 -658,-2" fill="#7A1B2C"/>
    <polygon points="636,-13 658,-2 658,12 636,23 614,12 614,-2" fill="#7A1B2C"/>
    <text text-anchor="middle" y="18" font-family="'DM Sans', Helvetica, sans-serif"
          font-size="56" font-weight="800" fill="#3d2b0a" letter-spacing="14"
          stroke="#3d2b0a" stroke-width="0.8" paint-order="stroke fill">
      APICOLTURA LA GRECA
    </text>
  </g>

  <!-- ── Wordmark gigante: Terre di Miele (con gradient su "di Miele") ─ -->
  <g transform="translate(1250 510)">
    <text text-anchor="middle" font-size="220" font-weight="700" letter-spacing="2">
      <tspan fill="#3d2b0a" stroke="#3d2b0a" stroke-width="1.5" paint-order="stroke fill">Terre </tspan><tspan font-style="italic" fill="url(#honeyGradR)" stroke="#3d2b0a" stroke-width="1" paint-order="stroke fill">di Miele</tspan>
    </text>
  </g>

  <!-- ── Divider centrale BORDEAUX — linee abbassate al centro esagono ── -->
  <!-- Esagono centro y = 2 (range -16..20). Wordmark baseline ≈ y=510 → centro 585. -->
  <g transform="translate(1250 585)">
    <line x1="-380" y1="2" x2="-40"  y2="2" stroke="#7A1B2C" stroke-width="2"/>
    <polygon points="0,-16 20,-6 20,10 0,20 -20,10 -20,-6" fill="#7A1B2C"/>
    <line x1="40"   y1="2" x2="380"  y2="2" stroke="#7A1B2C" stroke-width="2"/>
  </g>

  <!-- ── Tagline corsivo Great Vibes — INGRANDITA 110 → 130 ───────── -->
  <g transform="translate(1250 770)">
    <text text-anchor="middle" font-family="'Great Vibes', cursive"
          font-size="130" fill="#3d2b0a" font-style="italic" font-weight="700"
          stroke="#3d2b0a" stroke-width="3.6" paint-order="stroke fill"
          stroke-linejoin="round">
      Miele Siciliano
    </text>
  </g>

  <!-- ── Footer: 3 righe ingrandite. SALVATORE in gradient (come 'di Miele') ── -->
  <g transform="translate(1250 940)">
    <!-- Riga 1: SALVATORE LA GRECA — gradient honeyGradR -->
    <text text-anchor="middle" font-family="'DM Sans', Helvetica, sans-serif"
          font-size="80" font-weight="800" fill="url(#honeyGradR)" letter-spacing="6"
          stroke="#3d2b0a" stroke-width="1" paint-order="stroke fill">
      SALVATORE LA GRECA
    </text>
    <!-- Riga 2: CAMPOBELLO DI LICATA — INGRANDITA 56 → 68 -->
    <text text-anchor="middle" y="105" font-family="'DM Sans', Helvetica, sans-serif"
          font-size="68" font-weight="800" fill="#3d2b0a" letter-spacing="9"
          stroke="#3d2b0a" stroke-width="0.9" paint-order="stroke fill">
      CAMPOBELLO DI LICATA
    </text>
    <!-- Riga 3: www.terredimiele.it — INGRANDITA 56 → 68 -->
    <text text-anchor="middle" y="200" font-family="'DM Sans', Helvetica, sans-serif"
          font-size="68" font-weight="800" fill="#7A1B2C" letter-spacing="6"
          stroke="#7A1B2C" stroke-width="0.9" paint-order="stroke fill">
      www.terredimiele.it
    </text>
  </g>

</svg>
